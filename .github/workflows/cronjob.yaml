name: Trigger Action on a CRON Schedule

on:
  schedule:
    # Prueba de ejecución cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch: # Activa el botón de ejecución manual en la pestaña Actions

jobs:
  build:
    name: Trigger ETL
    runs-on: ubuntu-latest
    steps:
      # 1. Trae el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Instala Python con caché para agilizar la ejecución diaria
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.1'
          cache: 'pip'

      # 3. Instala las dependencias necesarias
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r src/requirements.txt

      # 4. Ejecuta tu script ETL
      - name: Run ETL Script
        run: |
          python -m src.main